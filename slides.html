<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slides</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0b1220;
      --panel: rgba(19, 28, 48, 0.76);
      --panel-soft: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --text: #e5eefb;
      --muted: rgba(229, 238, 251, 0.7);
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.14), transparent 24%),
        linear-gradient(180deg, #0b1220, #0f172a 40%, #111827 100%);
    }

    .app {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      height: 100vh;
      width: 100vw;
      gap: 0;
      transition: grid-template-columns 0.22s ease;
    }

    .sidebar {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      z-index: 2;
      overflow: hidden;
      width: 18px;
      transition: width 0.22s ease;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 30%, rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }

    .app:has(.sidebar:hover) {
      grid-template-columns: 320px minmax(0, 1fr);
    }

    .app:has(.sidebar:hover) .sidebar,
    .sidebar:hover {
      width: 320px;
    }

    .sidebar-body {
      flex: 1;
      overflow: auto;
      padding: 12px 10px 16px;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .app:has(.sidebar:hover) .sidebar-body,
    .sidebar:hover .sidebar-body {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .toc-list {
      display: grid;
      gap: 10px;
    }

    .toc-home-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .toc-home-toggle,
    .toc-home-go {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .toc-home-toggle {
      width: 100%;
      min-width: 0;
      cursor: pointer;
      font-size: 0.68rem;
      padding: 3px 8px;
      justify-content: flex-start;
    }

    .toc-home-go {
      text-decoration: none;
      justify-content: center;
      min-width: 42px;
      padding: 5px 8px;
    }

    .toc-home-go::after {
      content: "↗";
      font-size: 0.8rem;
      color: var(--muted);
    }

    .toc-home-toggle:hover,
    .toc-home-toggle:focus-visible,
    .toc-home-go:hover,
    .toc-home-go:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.46);
      background: rgba(56, 189, 248, 0.12);
      outline: none;
    }

    .toc-section {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    .toc-section-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .toc-section-toggle::after {
      content: "▾";
      font-size: 0.78rem;
      color: var(--muted);
      transition: transform 0.15s ease;
    }

    .toc-section-toggle[aria-expanded="false"]::after {
      transform: rotate(-90deg);
    }

    .toc-section-toggle:hover,
    .toc-section-toggle:focus-visible {
      border-color: rgba(56, 189, 248, 0.46);
      background: rgba(56, 189, 248, 0.12);
      outline: none;
    }

    .toc-section-body {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .toc-section-body[hidden] {
      display: none;
    }

    .toc-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      width: 100%;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .toc-item:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .toc-item.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.46);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.18) inset;
    }

    .toc-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .toc-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .main {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      background: rgba(2, 6, 23, 0.14);
    }

    .viewer {
      position: relative;
      min-height: 0;
      padding: 16px 18px 10px;
      display: grid;
      place-items: center;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: rgba(255, 255, 255, 0.02);
    }

    .page-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      background: rgba(255, 255, 255, 0.02);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.992);
    }

    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 2;
    }

    .nav-hit.prev {
      left: 0;
    }

    .nav-hit.next {
      right: 0;
    }

    .nav-hit.prev:hover {
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.16), transparent);
    }

    .nav-hit.next:hover {
      background: linear-gradient(270deg, rgba(15, 23, 42, 0.16), transparent);
    }

    .bottom-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      z-index: 3;
      overflow: hidden;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.14);
      flex: 0 0 auto;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.24);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .indicator {
      min-width: 56px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
      padding: 0 2px;
    }

    .hint {
      margin-left: auto;
      color: rgba(229, 238, 251, 0.52);
      font-size: 0.58rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 1120px) {
      .app {
        grid-template-columns: 18px minmax(0, 1fr);
      }

      .app:has(.sidebar:hover) {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .app:has(.sidebar:hover) .sidebar,
      .sidebar:hover {
        width: 280px;
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 280px minmax(0, 1fr);
      }

      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        overflow: auto;
      }

      .sidebar::after,
      .sidebar-header,
      .sidebar-body {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .sidebar::after {
        display: none;
      }

      .sidebar-body {
        padding-bottom: 10px;
      }

      .toc-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toc-item {
        padding: 6px;
      }

      .toc-thumb {
        aspect-ratio: 4 / 3;
      }

      .viewer {
        padding: 12px 12px 8px;
      }

      .frame {
        border-radius: 20px;
      }

      .bottom-bar {
        padding: 7px 10px 10px;
      }
    }

    @media (max-width: 560px) {
      .app {
        grid-template-rows: 240px minmax(0, 1fr);
      }

      .toc-list {
        grid-template-columns: 1fr;
      }

      .bottom-bar {
        flex-wrap: wrap;
      }

      .hint {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="목차 사이드바">
      <div class="sidebar-body">
        <div id="tocList" class="toc-list"></div>
      </div>
    </aside>

    <main class="main">
      <div class="viewer">
        <div class="frame" id="frame">
          <img id="pageImage" class="page-image" alt="Page 1" />
          <button class="nav-hit prev" id="stagePrev" type="button" aria-label="이전 페이지"></button>
          <button class="nav-hit next" id="stageNext" type="button" aria-label="다음 페이지"></button>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="controls">
          <button id="prevBtn" type="button" aria-label="이전 페이지">이전</button>
          <div id="pageIndicator" class="indicator">1 / 40</div>
          <button id="nextBtn" type="button" aria-label="다음 페이지">다음</button>
        </div>
        <div class="hint">왼쪽 목록 클릭 / 버튼 / ← → / 스와이프 / 휠 스크롤</div>
      </div>
    </main>
  </div>

  <script>
    const deckConfigs = {
      "202607v_SFire.md": {
        title: "202607v",
        totalPages: 40,
        imageBase: "Media",
        sections: [
          { title: "Section 01", start: 1 },
          { title: "Section 02", start: 6 },
          { title: "Section 03", start: 15 },
          { title: "Section 04", start: 26 }
        ]
      },
      "202609v_SFire.md": {
        title: "202609v",
        totalPages: 42,
        imageBase: "Media/202609",
        sections: [
          { title: "00 Agenda", start: 2 },
          { title: "01 문서 작성 심화", start: 3 },
          { title: "01-1 Excel", start: 5 },
          { title: "01-2 Word", start: 11 },
          { title: "01-2 PPT", start: 19 },
          { title: "02 Pages", start: 24 },
          { title: "03 Frontier Agents", start: 31 },
          { title: "04 Agent Builder", start: 36 }
        ]
      }
    };

    const requestedDoc = new URLSearchParams(location.search).get("doc") || "202607v_SFire.md";
    const deck = deckConfigs[requestedDoc] || deckConfigs["202607v_SFire.md"];
    const totalPages = deck.totalPages;
    document.title = deck.title;
    // Add slide numbers here to hide them from sidebar and navigation.
    const hiddenSlideNumbers = [];

    const hiddenSlides = new Set(hiddenSlideNumbers);
    const visiblePages = Array.from({ length: totalPages }, (_, index) => index + 1)
      .filter((page) => !hiddenSlides.has(page));

    if (!visiblePages.length) {
      throw new Error("All slides are hidden. Please keep at least one visible slide.");
    }

    const state = { page: visiblePages[0] };

    const pageImage = document.getElementById("pageImage");
    const pageIndicator = document.getElementById("pageIndicator");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const stagePrev = document.getElementById("stagePrev");
    const stageNext = document.getElementById("stageNext");
    const frame = document.getElementById("frame");
    const tocList = document.getElementById("tocList");

    const pad = (value) => String(value).padStart(3, "0");
    const label = (value) => String(value).padStart(2, "0");
    const getPageFileName = (page) => `${deck.imageBase}/page-${pad(page)}.png`;

    const tocButtons = new Map();
    const pageToSection = new Map();
    const sectionBodies = new Map();
    const sectionToggles = new Map();
    const imageCache = new Map();
    let renderToken = 0;

    const sectionDefinitions = deck.sections.map((section, index) => {
      const nextSection = deck.sections[index + 1];
      const start = section.start;
      const nextStart = nextSection?.start;
      const end = nextStart ? nextStart - 1 : totalPages;
      const id = String(index + 1).padStart(2, "0");
      return {
        id,
        title: section.title,
        start,
        end
      };
    });

    function getVisibleIndex(page) {
      return visiblePages.indexOf(page);
    }

    function getSafePage(page) {
      if (visiblePages.includes(page)) {
        return page;
      }

      const nextVisible = visiblePages.find((value) => value >= page);
      return nextVisible || visiblePages[visiblePages.length - 1];
    }

    function preloadPage(page) {
      if (!Number.isInteger(page) || page < 1 || page > totalPages) {
        return Promise.resolve("");
      }

      const fileName = getPageFileName(page);
      if (imageCache.has(fileName)) {
        return imageCache.get(fileName);
      }

      const promise = new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(fileName);
        image.onerror = () => resolve(fileName);
        image.src = fileName;
      });

      imageCache.set(fileName, promise);
      return promise;
    }

    function prewarmNeighbors(page) {
      const index = getVisibleIndex(page);
      if (index < 0) {
        return;
      }

      preloadPage(visiblePages[index - 1]);
      preloadPage(visiblePages[index + 1]);
    }

    function buildSidebar() {
      tocList.innerHTML = "";

      const homeRow = document.createElement("div");
      homeRow.className = "toc-home-row";

      const homeToggle = document.createElement("button");
      homeToggle.type = "button";
      homeToggle.className = "toc-home-toggle";
      homeToggle.textContent = "⇅";
      homeToggle.setAttribute("aria-label", "목차 일괄 접기 또는 펼치기");

      const homeGo = document.createElement("a");
      homeGo.className = "toc-home-go";
      homeGo.href = "index.html";
      homeGo.setAttribute("aria-label", "Home으로 이동");

      homeRow.appendChild(homeToggle);
      homeRow.appendChild(homeGo);
      tocList.appendChild(homeRow);

      sectionDefinitions.forEach((section) => {
        const sectionPages = visiblePages.filter((page) => page >= section.start && page <= section.end);
        if (!sectionPages.length) {
          return;
        }

        const sectionElement = document.createElement("section");
        sectionElement.className = "toc-section";

        const toggle = document.createElement("button");
        const bodyId = `toc-section-${section.id}`;
        toggle.type = "button";
        toggle.className = "toc-section-toggle";
        toggle.textContent = section.title;
        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-controls", bodyId);

        const body = document.createElement("div");
        body.id = bodyId;
        body.className = "toc-section-body";

        toggle.addEventListener("click", () => {
          const expanded = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!expanded));
          body.hidden = expanded;
        });

        sectionPages.forEach((page) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "toc-item";
          item.dataset.page = String(page);
          item.setAttribute("aria-label", `Page ${label(page)}`);

          const thumb = document.createElement("div");
          thumb.className = "toc-thumb";

          const image = document.createElement("img");
          image.src = getPageFileName(page);
          image.alt = `Page ${page} preview`;
          image.loading = "lazy";

          thumb.appendChild(image);
          item.appendChild(thumb);

          item.addEventListener("click", () => renderPage(page));
          body.appendChild(item);

          tocButtons.set(page, item);
          pageToSection.set(page, section.id);
        });

        sectionBodies.set(section.id, body);
        sectionToggles.set(section.id, toggle);

        sectionElement.appendChild(toggle);
        sectionElement.appendChild(body);
        tocList.appendChild(sectionElement);
      });

      homeToggle.addEventListener("click", () => {
        const hasExpanded = Array.from(sectionBodies.values()).some((body) => !body.hidden);
        const shouldExpandAll = !hasExpanded;

        for (const [sectionId, body] of sectionBodies.entries()) {
          const toggle = sectionToggles.get(sectionId);
          if (!toggle) {
            continue;
          }

          body.hidden = !shouldExpandAll;
          toggle.setAttribute("aria-expanded", String(shouldExpandAll));
        }
      });
    }

    function setActiveSidebar(page) {
      for (const [itemPage, element] of tocButtons.entries()) {
        element.classList.toggle("active", itemPage === page);
      }

      const sectionId = pageToSection.get(page);
      if (sectionId) {
        const body = sectionBodies.get(sectionId);
        const toggle = sectionToggles.get(sectionId);
        if (body && toggle && body.hidden) {
          body.hidden = false;
          toggle.setAttribute("aria-expanded", "true");
        }
      }

      const active = tocButtons.get(page);
      if (active) {
        active.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    async function renderPage(page) {
      const safePage = getSafePage(page);
      state.page = safePage;
      const currentToken = ++renderToken;
      const fileName = getPageFileName(safePage);
      const visibleIndex = getVisibleIndex(safePage);

      await preloadPage(safePage);
      if (currentToken !== renderToken) {
        return;
      }

      pageImage.src = fileName;
      pageImage.alt = `Page ${safePage}`;
      pageIndicator.textContent = `${visibleIndex + 1} / ${visiblePages.length}`;
      prevBtn.disabled = visibleIndex <= 0;
      stagePrev.disabled = visibleIndex <= 0;
      nextBtn.disabled = visibleIndex >= visiblePages.length - 1;
      stageNext.disabled = visibleIndex >= visiblePages.length - 1;
      location.hash = `page-${pad(safePage)}`;
      setActiveSidebar(safePage);
      prewarmNeighbors(safePage);
    }

    function goPrev() {
      const index = getVisibleIndex(state.page);
      if (index > 0) {
        renderPage(visiblePages[index - 1]);
      }
    }

    function goNext() {
      const index = getVisibleIndex(state.page);
      if (index >= 0 && index < visiblePages.length - 1) {
        renderPage(visiblePages[index + 1]);
      }
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);
    stagePrev.addEventListener("click", goPrev);
    stageNext.addEventListener("click", goNext);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        goPrev();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        goNext();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    frame.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    frame.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < 40 || Math.abs(deltaX) < Math.abs(deltaY)) {
        return;
      }

      if (deltaX < 0) {
        goNext();
      } else {
        goPrev();
      }
    }, { passive: true });

    let wheelLocked = false;
    let wheelAccumulated = 0;

    frame.addEventListener("wheel", (event) => {
      event.preventDefault();

      if (wheelLocked) {
        return;
      }

      wheelAccumulated += event.deltaY;
      if (Math.abs(wheelAccumulated) < 42) {
        return;
      }

      wheelLocked = true;
      if (wheelAccumulated > 0) {
        goNext();
      } else {
        goPrev();
      }

      wheelAccumulated = 0;

      window.setTimeout(() => {
        wheelLocked = false;
      }, 180);
    }, { passive: false });

    const initialPage = (() => {
      const hash = location.hash.match(/page-(\d{3})/);
      if (!hash) return visiblePages[0];
      const parsed = Number(hash[1]);
      if (!Number.isFinite(parsed) || parsed < 1 || parsed > totalPages) {
        return visiblePages[0];
      }

      return getSafePage(parsed);
    })();

    buildSidebar();
    renderPage(initialPage);
  </script>
</body>
</html>
