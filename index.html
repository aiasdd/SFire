<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #38bdf8;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, #0ea5e9 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, #22d3ee 0%, transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      padding: 10px;
      overflow: hidden;
    }

    .home {
      width: min(1240px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      padding: clamp(20px, 4vw, 40px);
      max-height: calc(100vh - 20px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .card-link {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      background: rgba(15, 23, 42, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card-link:hover,
    .card-link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25);
      outline: none;
    }

    .card-link strong {
      display: block;
      font-size: 1.05rem;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .card-link span {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .card-link-list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }

    .card-link-list li {
      flex: 0 0 auto;
    }

    .card-link-list a {
      display: block;
      text-decoration: none;
      color: var(--text);
      font-size: 0.88rem;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.03);
      transition: border-color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }

    .card-link-list a:hover,
    .card-link-list a:focus-visible {
      border-color: var(--accent);
      background: rgba(34, 211, 238, 0.12);
      outline: none;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #083344;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      font-weight: 600;
    }

    .file-panels {
      margin-top: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      min-height: 0;
    }

    .file-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.45);
      padding: 14px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .file-panel h2 {
      margin: 0 0 8px;
      font-size: 1.02rem;
      color: #f8fafc;
    }

    .file-panel-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: #f8fafc;
      padding: 0;
      margin: 0 0 8px;
      font-size: 1.02rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .file-panel-toggle::after {
      content: "▸";
      color: var(--muted);
      font-size: 0.9rem;
      transition: transform 0.15s ease;
    }

    .file-panel-toggle[aria-expanded="true"]::after {
      transform: rotate(90deg);
    }

    .file-panel-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .file-panel-body[hidden] {
      display: none;
    }

    .file-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
      min-height: 0;
      overflow: auto;
    }

    .file-list a {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.9rem;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .file-list a:hover,
    .file-list a:focus-visible {
      border-color: var(--accent);
      background: rgba(34, 211, 238, 0.12);
      outline: none;
    }

    .empty {
      color: var(--muted);
      font-size: 0.88rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="home">
    <!--
    <h1>Welcome</h1>
    <p>아래 항목을 클릭하면 각각의 페이지로 이동합니다.</p>
    -->

    <section class="links" aria-label="Navigation Links">
      <div class="card-link" role="group" aria-label="Labs 문서 링크">
        <strong>Labs</strong>

        <ul class="card-link-list" aria-label="Labs markdown files">
          <li><a href="labs.html?doc=01.Chat.md">01.Chat</a></li>
          <li><a href="labs.html?doc=02.Word.md">02.Word</a></li>
          <li><a href="labs.html?doc=03.Excel.md">03.Excel</a></li>
          <li><a href="labs.html?doc=04.PPT.md">04.PPT</a></li>
          <li><a href="labs.html?doc=05.AgentBuilder.md">05.AgentBuilder</a></li>
        </ul>
      </div>

      <a class="card-link" href="slides.html">
        <strong>Slides</strong>
      </a>
    </section>

    <section class="file-panels" aria-label="File Links">
      <article class="file-panel" aria-labelledby="labfiles-title">
        <button
          id="labfiles-title"
          class="file-panel-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="labfiles-body"
        >
          Labfiles
        </button>
        <div id="labfiles-body" class="file-panel-body" hidden>
          <ul id="labfiles-list" class="file-list"></ul>
        </div>
      </article>

      <article class="file-panel" aria-labelledby="clips-title">
        <button
          id="clips-title"
          class="file-panel-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="clips-body"
        >
          Clips
        </button>
        <div id="clips-body" class="file-panel-body" hidden>
          <ul id="clips-list" class="file-list"></ul>
        </div>
      </article>
    </section>
  </main>

  <script>
    const filesByFolder = {
      Labfiles: [
        "(첨부파일 1) 보험상품_판매분석_실습자료.xlsx",
        "(첨부파일 2) 자동차보험 약관(개정 전).pdf",
        "(첨부파일 3) 자동차보험 약관(개정 후).pdf",
        "(첨부파일 4) 보험 데이터 분석.xlsx",
        "(첨부파일 5) M365_Copilot_도입전략_보고서.docx",
        "(첨부파일 6) HR_Policy_Guide_에이전트 지식소스.docx",
        "Labs_prompts.txt",
        "Microsoft 365 Copilot 삼성화재 교안 7월.pdf"
      ],
      Clips: [
        "cowork.mp4_ko-KR.mp4",
        "Researcher-Council.mp4",
        "Word.excel.powerpoint agent_ko-KR.mp4"
      ]
    };

    function createFileHref(folderName, fileName) {
      return `${folderName}/${encodeURIComponent(fileName)}`;
    }

    function renderFileList(listId, folderName, fileNames) {
      const list = document.getElementById(listId);
      if (!list) {
        return;
      }

      list.innerHTML = "";

      if (!fileNames.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "표시할 파일이 없습니다.";
        list.replaceWith(empty);
        return;
      }

      fileNames.forEach((fileName) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = createFileHref(folderName, fileName);
        a.textContent = fileName;
        a.setAttribute("download", fileName);
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    function enableFilePanelsToggle() {
      const toggles = document.querySelectorAll(".file-panel-toggle");

      toggles.forEach((toggle) => {
        const bodyId = toggle.getAttribute("aria-controls");
        const panelBody = bodyId ? document.getElementById(bodyId) : null;
        if (!panelBody) {
          return;
        }

        toggle.addEventListener("click", () => {
          const expanded = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!expanded));
          panelBody.hidden = expanded;
        });
      });
    }

    renderFileList("labfiles-list", "Labfiles", filesByFolder.Labfiles);
    renderFileList("clips-list", "Clips", filesByFolder.Clips);
    enableFilePanelsToggle();
  </script>
</body>
</html>
