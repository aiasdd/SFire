<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #38bdf8;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, #0ea5e9 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, #22d3ee 0%, transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      padding: 24px;
    }

    .home {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      padding: clamp(20px, 4vw, 40px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .card-link {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      background: rgba(15, 23, 42, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card-link:hover,
    .card-link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25);
      outline: none;
    }

    .card-link strong {
      display: block;
      font-size: 1.05rem;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .card-link span {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #083344;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="home">
    <!--
    <h1>Welcome</h1>
    <p>아래 항목을 클릭하면 각각의 페이지로 이동합니다.</p>
    -->

    <section class="links" aria-label="Navigation Links">
      <a class="card-link" href="labs.html">
        <strong>Labs</strong>
      </a>

      <a class="card-link" href="slides.html">
        <strong>Slides</strong>
      </a>
    </section>
  </main>
</body>
</html>
