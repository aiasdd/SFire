<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labs Document</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #dbe3ee;
      --text: #142033;
      --muted: #5e6f86;
      --accent: #0f6cbd;
      --accent-soft: #e8f2fc;
      --section-soft: #f4f8fd;
      --code-bg: #0f172a;
      --code-text: #d6deeb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }

    .page {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      position: relative;
    }

    .toc {
      position: fixed;
      top: 20px;
      left: 0;
      width: 230px;
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      z-index: 10;
      transform: translateX(calc(-100% + 14px));
      transition: transform 0.22s ease;
    }

    .toc:hover,
    .toc:focus-within {
      transform: translateX(0);
    }

    .toc h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
    }

    .toc ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .toc li {
      margin: 0;
    }

    .toc a {
      display: block;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .toc a:hover,
    .toc a:focus-visible {
      color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .toc .level-1 a { padding-left: 8px; font-weight: 700; }
    .toc .level-2 a { padding-left: 14px; font-weight: 600; }
    .toc .level-3 a { padding-left: 20px; }
    .toc .level-4 a { padding-left: 26px; }

    .content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(18px, 3vw, 34px);
      min-height: calc(100vh - 40px);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
    }

    .topbar a {
      text-decoration: none;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }

    #doc {
      line-height: 1.7;
      word-break: keep-all;
    }

    #doc h1,
    #doc h2,
    #doc h3,
    #doc h4 {
      scroll-margin-top: 24px;
      margin-top: 1.6em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    #doc h2 {
      background: var(--section-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 1.9em;
      margin-bottom: 0.9em;
    }

    #doc p {
      margin: 0.8em 0;
    }

    #doc blockquote {
      margin: 1em 0;
      padding: 0.7em 1em;
      background: #f8fbff;
      border-left: 4px solid var(--accent);
      color: #30445f;
    }

    #doc img {
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      display: block;
      margin: 10px 0;
    }

    #doc pre {
      position: relative;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 40px 12px 12px;
      border-radius: 10px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .copy-btn:hover,
    .copy-btn:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      outline: none;
    }

    #doc pre,
    #doc pre code {
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }

    #doc pre code {
      display: block;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #doc :not(pre) > code {
      font-family: Consolas, "Courier New", monospace;
    }

    #doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.95rem;
    }

    #doc th,
    #doc td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .loading,
    .error {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 8px 0;
    }

    .error {
      color: #9f1239;
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        transform: none;
        max-height: none;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="toc" aria-label="문서 목차">
      <h2>목차</h2>
      <ol id="toc-list"></ol>
    </aside>

    <main class="content">
      <div class="topbar">
        <h1>Labs</h1>
        <a href="index.html">Home</a>
      </div>
      <div id="doc" class="loading">Labs.md를 불러오는 중입니다...</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/<[^>]*>/g, "")
        .replace(/["'`]/g, "")
        .replace(/[^\w\u3131-\uD79D\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
    }

    function extractHeadings(markdown) {
      const lines = markdown.split(/\r?\n/);
      const headings = [];
      let inCodeBlock = false;

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          inCodeBlock = !inCodeBlock;
          continue;
        }
        if (inCodeBlock) {
          continue;
        }

        const match = line.match(/^(#{1,4})\s+(.+)$/);
        if (!match) {
          continue;
        }

        const level = match[1].length;
        const text = match[2].trim();
        headings.push({ level, text });
      }

      return headings;
    }

    function buildToc(headings) {
      const list = document.getElementById("toc-list");
      list.innerHTML = "";

      const used = new Map();

      headings.forEach((h) => {
        const base = slugify(h.text) || "section";
        const count = (used.get(base) || 0) + 1;
        used.set(base, count);
        const id = count === 1 ? base : `${base}-${count}`;
        h.id = id;

        const li = document.createElement("li");
        li.className = `level-${h.level}`;

        const a = document.createElement("a");
        a.href = `#${id}`;
        a.textContent = h.text;
        li.appendChild(a);

        list.appendChild(li);
      });

      return headings;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "absolute";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
    }

    function addCopyButtons(root) {
      const blocks = root.querySelectorAll("pre > code");

      blocks.forEach((code) => {
        const pre = code.parentElement;
        if (!pre || pre.querySelector(".copy-btn")) {
          return;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "복사";
        button.setAttribute("aria-label", "코드 복사");

        button.addEventListener("click", async () => {
          const original = button.textContent;
          try {
            await copyText(code.innerText);
            button.textContent = "복사됨";
          } catch {
            button.textContent = "실패";
          }

          window.setTimeout(() => {
            button.textContent = original;
          }, 1200);
        });

        pre.appendChild(button);
      });
    }

    async function render() {
      const doc = document.getElementById("doc");

      try {
        const response = await fetch("Labs.md", { cache: "no-cache" });
        if (!response.ok) {
          throw new Error(`Labs.md 로드 실패: ${response.status}`);
        }

        const markdown = await response.text();
        const headings = buildToc(extractHeadings(markdown));

        doc.className = "";
        doc.innerHTML = marked.parse(markdown, {
          gfm: true,
          breaks: false
        });

        const renderedHeadings = doc.querySelectorAll("h1, h2, h3, h4");
        headings.forEach((h, index) => {
          if (renderedHeadings[index]) {
            renderedHeadings[index].id = h.id;
          }
        });

        addCopyButtons(doc);
      } catch (error) {
        doc.className = "error";
        doc.textContent = `문서를 렌더링하지 못했습니다: ${error.message}`;
      }
    }

    render();
  </script>
</body>
</html>
