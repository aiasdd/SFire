<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labs</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #dbe3ee;
      --text: #142033;
      --muted: #5e6f86;
      --accent: #0f6cbd;
      --accent-soft: #e8f2fc;
      --section-soft: #f4f8fd;
      --code-bg: #0f172a;
      --code-text: #d6deeb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }

    .page {
      --toc-width: 200px;
      width: min(1860px, 100%);
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: var(--toc-width) 2px minmax(0, 1fr);
      gap: 2px;
      align-items: start;
      position: relative;
      transition: grid-template-columns 0.22s ease;
    }

    .page.toc-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }

    .toc {
      position: sticky;
      top: 20px;
      left: auto;
      width: 100%;
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      z-index: 10;
      transition: opacity 0.16s ease;
    }

    .toc.is-collapsed {
      display: none;
    }

    .toc-resizer {
      width: 1px;
      min-height: calc(100vh - 40px);
      border-radius: 999px;
      background: rgba(15, 108, 189, 0.05);
      cursor: col-resize;
      touch-action: none;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      position: sticky;
      top: 20px;
      opacity: 0.06;
      justify-self: center;
    }

    .toc-resizer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 100%;
    }

    .toc-resizer:hover,
    .toc-resizer:focus-visible,
    .toc-resizer.is-dragging {
      background: rgba(15, 108, 189, 0.45);
      opacity: 1;
      outline: none;
    }

    .page.toc-collapsed .toc-resizer {
      display: none;
    }

    .toc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .toc h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
    }

    .toc-title {
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      margin: -2px -4px 10px;
    }

    .toc-title:hover,
    .toc-title:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }

    .toc-toggle-btn,
    .toc-open-btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
    }

    .toc-toggle-btn {
      margin-bottom: 12px;
    }

    .toc-open-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 11;
      display: none;
    }

    .toc-open-btn.is-visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .toc-toggle-btn:hover,
    .toc-toggle-btn:focus-visible,
    .toc-open-btn:hover,
    .toc-open-btn:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .toc ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .toc li {
      margin: 0;
    }

    .toc a {
      display: block;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .toc a:hover,
    .toc a:focus-visible {
      color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .toc .level-1 a { padding-left: 8px; font-weight: 700; }
    .toc .level-2 a { padding-left: 14px; font-weight: 600; }
    .toc .level-3 a { padding-left: 20px; }
    .toc .level-4 a { padding-left: 26px; }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(18px, 3vw, 34px);
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .doc-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      z-index: 2;
    }

    .doc-nav-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .doc-edge-nav {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      opacity: 0;
    }

    .doc-edge-nav.prev {
      left: 0;
    }

    .doc-edge-nav.next {
      right: 0;
    }

    .doc-edge-nav:focus-visible {
      outline: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
    }

    .topbar a {
      text-decoration: none;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .doc-selector {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .doc-selector label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .doc-selector select {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      font-size: 0.82rem;
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 170px;
    }

    .doc-selector select:focus-visible {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .toggle-all-btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .toggle-all-btn:hover,
    .toggle-all-btn:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .toggle-all-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #doc {
      position: relative;
      line-height: 1.7;
      word-break: keep-all;
    }

    #doc h1,
    #doc h2,
    #doc h3,
    #doc h4 {
      scroll-margin-top: 24px;
      margin-top: 1.6em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    #doc h2 {
      background: var(--section-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 1.9em;
      margin-bottom: 0.9em;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: background-color 0.15s ease;
      padding-right: 42px;
    }

    #doc h2:has(+ .tips-panel) {
      margin-bottom: 0.25em;
    }

    #doc h2:hover,
    #doc h2:focus-visible {
      background: #eaf2fb;
      outline: none;
    }

    #doc h2::after {
      content: "▾";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    #doc h2.is-collapsed::after {
      transform: translateY(-50%) rotate(-90deg);
    }

    #doc p {
      margin: 0.8em 0;
    }

    #doc blockquote {
      margin: 0.5em 0;
      padding: 0.45em 0.8em;
      background: #f8fbff;
      border-left: 4px solid var(--accent);
      color: #30445f;
    }

    #doc blockquote p {
      margin: 0.25em 0;
      line-height: 1.45;
    }

    #doc blockquote p:first-child,
    #doc blockquote p:last-child {
      margin-top: 0;
      margin-bottom: 0;
    }

    #doc blockquote ul,
    #doc blockquote ol {
      margin: 0.2em 0;
      padding-left: 1.2em;
    }

    #doc blockquote li {
      margin: 0.12em 0;
      line-height: 1.4;
    }

    #doc img {
      cursor: zoom-in;
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      display: block;
      margin: 10px 0;
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 15, 29, 0.82);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .image-lightbox.is-open {
      display: flex;
    }

    .image-lightbox-backdrop {
      position: absolute;
      inset: 0;
    }

    .image-lightbox-content {
      position: relative;
      z-index: 1;
      max-width: min(96vw, 1400px);
      max-height: 92vh;
      display: grid;
      gap: 10px;
    }

    .image-lightbox img {
      display: block;
      max-width: 100%;
      max-height: 84vh;
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      background: rgba(255, 255, 255, 0.98);
      cursor: zoom-out;
    }

    .image-lightbox-caption {
      color: rgba(229, 238, 251, 0.84);
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 96vw;
      word-break: keep-all;
    }

    #doc pre {
      position: relative;
      z-index: 4;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .copy-btn:hover,
    .copy-btn:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      outline: none;
    }

    #doc pre,
    #doc pre code {
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }

    #doc pre code {
      display: block;
      font-size: 0.9rem;
      line-height: 1.45;
      padding-right: 72px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #doc :not(pre) > code {
      font-family: Consolas, "Courier New", monospace;
    }

    #doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.95rem;
    }

    #doc .tips-panel {
      margin: 0.65em 0;
      padding: 0.72em 0.9em;
      border: 1px solid #b8d4ee;
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      background: linear-gradient(180deg, #f3f9ff 0%, #eef6ff 100%);
    }

    #doc h2 + .tips-panel {
      margin-top: 0.3em;
    }

    #doc .tips-panel + h2 {
      margin-top: 0.6em;
    }

    #doc .tips-panel > h1,
    #doc .tips-panel > h2,
    #doc .tips-panel > h3,
    #doc .tips-panel > h4 {
      margin-top: 0;
      margin-bottom: 0.45em;
    }

    #doc th,
    #doc td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .loading,
    .error {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 8px 0;
    }

    .error {
      color: #9f1239;
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: 1fr;
      }

      .page.toc-collapsed {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        max-height: none;
        width: auto;
      }

      .toc-resizer {
        display: none;
      }

      .toc-open-btn {
        top: 12px;
        left: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="toc" aria-label="문서 목차">
      <div class="toc-header">
        <h2 id="toc-title" class="toc-title" role="button" tabindex="0" aria-label="컨텐츠 최상단으로 이동">목차</h2>
        <button id="toc-toggle-btn" class="toc-toggle-btn" type="button" aria-label="목차 접기">접기</button>
      </div>
      <ol id="toc-list"></ol>
    </aside>
    <div id="toc-resizer" class="toc-resizer" role="separator" aria-orientation="vertical" aria-label="목차 너비 조절"></div>
    <button id="toc-open-btn" class="toc-open-btn" type="button" aria-label="목차 열기">목차</button>

    <main class="content">
      <div class="topbar">
        <h1 id="page-title">Labs</h1>
        <div class="topbar-actions">
          <div class="doc-selector">
            <label for="doc-select">문서</label>
            <select id="doc-select" aria-label="표시할 랩 문서 선택"></select>
          </div>
          <button id="toggle-all-btn" class="toggle-all-btn" type="button" aria-label="모두 접기">모두 접기</button>
          <a href="index.html">Home</a>
        </div>
      </div>
      <div class="doc-stage">
        <div id="doc" class="loading">문서를 불러오는 중입니다...</div>
        <div class="doc-nav-layer" aria-hidden="true">
          <button id="doc-prev-btn" class="doc-edge-nav prev" type="button" aria-label="이전 문서로 이동"></button>
          <button id="doc-next-btn" class="doc-edge-nav next" type="button" aria-label="다음 문서로 이동"></button>
        </div>
      </div>
    </main>
  </div>

  <div id="image-lightbox" class="image-lightbox" aria-hidden="true">
    <div class="image-lightbox-backdrop" data-lightbox-close></div>
    <div class="image-lightbox-content" role="dialog" aria-modal="true" aria-label="이미지 확대 보기">
      <img id="lightbox-image" alt="" />
      <div id="lightbox-caption" class="image-lightbox-caption"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/<[^>]*>/g, "")
        .replace(/["'`]/g, "")
        .replace(/[^\w\u3131-\uD79D\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
    }

    function extractHeadings(markdown) {
      const lines = markdown.split(/\r?\n/);
      const headings = [];
      let inCodeBlock = false;

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          inCodeBlock = !inCodeBlock;
          continue;
        }
        if (inCodeBlock) {
          continue;
        }

        const match = line.match(/^(#{1,4})\s+(.+)$/);
        if (!match) {
          continue;
        }

        const level = match[1].length;
        const text = match[2].trim();
        headings.push({ level, text });
      }

      return headings;
    }

    function buildToc(headings) {
      const list = document.getElementById("toc-list");
      list.innerHTML = "";

      const used = new Map();
      const visibleHeadings = headings.filter((h) => h.level >= 2);

      visibleHeadings.forEach((h) => {
        const base = slugify(h.text) || "section";
        const count = (used.get(base) || 0) + 1;
        used.set(base, count);
        const id = count === 1 ? base : `${base}-${count}`;
        h.id = id;

        const li = document.createElement("li");
        li.className = `level-${h.level}`;

        const a = document.createElement("a");
        a.href = `#${id}`;
        a.textContent = h.text;
        li.appendChild(a);

        list.appendChild(li);
      });

      return visibleHeadings;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "absolute";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
    }

    function openImageLightbox(src, alt) {
      const lightbox = document.getElementById("image-lightbox");
      const image = document.getElementById("lightbox-image");
      const caption = document.getElementById("lightbox-caption");

      if (!lightbox || !image || !caption) {
        return;
      }

      image.src = src;
      image.alt = alt || "확대된 이미지";
      caption.textContent = alt || "";
      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeImageLightbox() {
      const lightbox = document.getElementById("image-lightbox");
      const image = document.getElementById("lightbox-image");

      if (!lightbox || !image) {
        return;
      }

      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      image.removeAttribute("src");
      image.alt = "";
      document.body.style.overflow = "";
    }

    function bindImageLightbox(root) {
      const images = root.querySelectorAll("img");

      images.forEach((image) => {
        if (image.dataset.lightboxBound === "true") {
          return;
        }

        image.dataset.lightboxBound = "true";
        image.addEventListener("click", () => {
          openImageLightbox(image.currentSrc || image.src, image.alt);
        });
      });
    }

    function addCopyButtons(root) {
      const blocks = root.querySelectorAll("pre > code");

      blocks.forEach((code) => {
        const pre = code.parentElement;
        if (!pre || pre.querySelector(".copy-btn")) {
          return;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "복사";
        button.setAttribute("aria-label", "코드 복사");

        button.addEventListener("click", async () => {
          const original = button.textContent;
          try {
            await copyText(code.innerText);
            button.textContent = "복사됨";
          } catch {
            button.textContent = "실패";
          }

          window.setTimeout(() => {
            button.textContent = original;
          }, 1200);
        });

        pre.appendChild(button);
      });
    }

    function decorateTipsSections(root) {
      const headings = root.querySelectorAll("h1, h2, h3, h4");

      headings.forEach((heading) => {
        if (heading.tagName !== "H3") {
          return;
        }

        if (heading.parentElement && heading.parentElement.classList.contains("tips-panel")) {
          return;
        }

        const wrapper = document.createElement("section");
        wrapper.className = "tips-panel";
        const currentLevel = Number(heading.tagName.substring(1));

        heading.parentNode.insertBefore(wrapper, heading);
        wrapper.appendChild(heading);

        let next = wrapper.nextSibling;
        while (next) {
          const candidate = next;
          next = next.nextSibling;

          if (candidate.nodeType === Node.ELEMENT_NODE && /^H[1-4]$/.test(candidate.tagName)) {
            const candidateLevel = Number(candidate.tagName.substring(1));
            if (candidateLevel <= currentLevel) {
              break;
            }
          }

          wrapper.appendChild(candidate);
        }
      });
    }

    function getH2SectionNodes(heading) {
      const sectionNodes = [];
      let next = heading.nextElementSibling;

      while (next && next.tagName !== "H2") {
        sectionNodes.push(next);
        next = next.nextElementSibling;
      }

      return sectionNodes;
    }

    function toggleH2Section(heading) {
      const sectionNodes = getH2SectionNodes(heading);
      const collapsed = !heading.classList.contains("is-collapsed");

      heading.classList.toggle("is-collapsed", collapsed);
      heading.setAttribute("aria-expanded", String(!collapsed));

      sectionNodes.forEach((node) => {
        node.hidden = collapsed;
      });
    }

    function setH2SectionCollapsed(heading, collapsed) {
      const sectionNodes = getH2SectionNodes(heading);

      heading.classList.toggle("is-collapsed", collapsed);
      heading.setAttribute("aria-expanded", String(!collapsed));

      sectionNodes.forEach((node) => {
        node.hidden = collapsed;
      });
    }

    function syncToggleAllButton() {
      const toggleAllBtn = document.getElementById("toggle-all-btn");
      const h2Headings = document.querySelectorAll("#doc h2");
      if (!toggleAllBtn) {
        return;
      }

      if (!h2Headings.length) {
        toggleAllBtn.disabled = true;
        toggleAllBtn.textContent = "모두 접기";
        toggleAllBtn.setAttribute("aria-label", "모두 접기");
        return;
      }

      toggleAllBtn.disabled = false;
      const hasExpanded = Array.from(h2Headings).some((heading) => !heading.classList.contains("is-collapsed"));
      toggleAllBtn.textContent = hasExpanded ? "모두 접기" : "모두 펼치기";
      toggleAllBtn.setAttribute("aria-label", toggleAllBtn.textContent);
    }

    function findOwnerH2(heading) {
      if (heading.tagName === "H2") {
        return heading;
      }

      const h2Headings = Array.from(document.querySelectorAll("#doc h2"));
      for (const h2 of h2Headings) {
        const sectionNodes = getH2SectionNodes(h2);
        const inSection = sectionNodes.some((node) => node === heading || node.contains(heading));
        if (inSection) {
          return h2;
        }
      }

      return null;
    }

    function jumpToHeadingById(id) {
      const target = document.getElementById(id);
      if (!target) {
        return;
      }

      const ownerH2 = findOwnerH2(target);
      if (ownerH2 && ownerH2.classList.contains("is-collapsed")) {
        setH2SectionCollapsed(ownerH2, false);
      }

      syncToggleAllButton();
      target.scrollIntoView({ behavior: "smooth", block: "start" });

      if (history.pushState) {
        history.pushState(null, "", `#${id}`);
      } else {
        location.hash = id;
      }
    }

    function enableTocNavigation() {
      const list = document.getElementById("toc-list");
      if (!list) {
        return;
      }

      list.onclick = (event) => {
        const link = event.target.closest('a[href^="#"]');
        if (!link) {
          return;
        }

        event.preventDefault();
        const id = decodeURIComponent(link.getAttribute("href").slice(1));
        jumpToHeadingById(id);
      };
    }

    function setupTocToggle() {
      const page = document.querySelector(".page");
      const toc = document.querySelector(".toc");
      const toggleBtn = document.getElementById("toc-toggle-btn");
      const openBtn = document.getElementById("toc-open-btn");
      if (!page || !toc || !toggleBtn || !openBtn) {
        return;
      }

      const setCollapsed = (collapsed) => {
        toc.classList.toggle("is-collapsed", collapsed);
        page.classList.toggle("toc-collapsed", collapsed);
        openBtn.classList.toggle("is-visible", collapsed);
        toggleBtn.setAttribute("aria-label", collapsed ? "목차 열기" : "목차 접기");
        toggleBtn.textContent = collapsed ? "열기" : "접기";
      };

      toggleBtn.addEventListener("click", () => {
        const collapsed = !toc.classList.contains("is-collapsed");
        setCollapsed(collapsed);
      });

      openBtn.addEventListener("click", () => {
        setCollapsed(false);
      });

      setCollapsed(true);
    }

    function setupTocTitleJump() {
      const tocTitle = document.getElementById("toc-title");
      const content = document.querySelector(".content");
      if (!tocTitle || !content) {
        return;
      }

      const jumpToTop = () => {
        content.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      tocTitle.addEventListener("click", jumpToTop);
      tocTitle.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") {
          return;
        }

        event.preventDefault();
        jumpToTop();
      });
    }

    function setupTocResizer() {
      const page = document.querySelector(".page");
      const resizer = document.getElementById("toc-resizer");
      if (!page || !resizer) {
        return;
      }

      let isDragging = false;
      let activePointerId = null;

      const clampWidth = (rawWidth) => {
        const min = 180;
        const max = Math.min(520, Math.max(260, Math.floor(window.innerWidth * 0.5)));
        return Math.max(min, Math.min(max, rawWidth));
      };

      const onPointerMove = (event) => {
        if (!isDragging) {
          return;
        }

        const nextWidth = clampWidth(event.clientX - 20);
        page.style.setProperty("--toc-width", `${nextWidth}px`);
      };

      const onPointerUp = () => {
        if (!isDragging) {
          return;
        }

        isDragging = false;
        resizer.classList.remove("is-dragging");
        document.body.style.userSelect = "";

        if (activePointerId !== null) {
          resizer.releasePointerCapture?.(activePointerId);
          activePointerId = null;
        }
      };

      resizer.addEventListener("pointerdown", (event) => {
        if (window.matchMedia("(max-width: 760px)").matches) {
          return;
        }

        isDragging = true;
        activePointerId = event.pointerId;
        resizer.classList.add("is-dragging");
        document.body.style.userSelect = "none";
        resizer.setPointerCapture?.(event.pointerId);
      });

      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
    }

    function enableH2Collapsible(root) {
      const h2Headings = root.querySelectorAll("h2");
      const toggleAllBtn = document.getElementById("toggle-all-btn");

      h2Headings.forEach((heading) => {
        heading.setAttribute("role", "button");
        heading.setAttribute("tabindex", "0");
        heading.setAttribute("aria-expanded", "true");

        heading.addEventListener("click", () => {
          toggleH2Section(heading);
          syncToggleAllButton();
        });

        heading.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }

          event.preventDefault();
          toggleH2Section(heading);
          syncToggleAllButton();
        });
      });

      if (toggleAllBtn) {
        toggleAllBtn.addEventListener("click", () => {
          const shouldCollapseAll = Array.from(h2Headings).some((heading) => !heading.classList.contains("is-collapsed"));
          h2Headings.forEach((heading) => {
            setH2SectionCollapsed(heading, shouldCollapseAll);
          });
          syncToggleAllButton();
        });
      }

      syncToggleAllButton();
    }

    const LAB_DOCS = [
      "00.WorkIQ.md",
      "01.Chat.md",
      "02.Word.md",
      "03.Excel.md",
      "04.PPT.md",
      "05.AgentBuilder.md"
    ];

    function resolveRequestedDoc() {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("doc");
      if (!requested) {
        return LAB_DOCS[0];
      }

      const matched = LAB_DOCS.find((file) => file === requested);
      return matched || LAB_DOCS[0];
    }

    function formatDocLabel(fileName) {
      return fileName.replace(/\.md$/i, "");
    }

    function getDocIndex(docName) {
      return LAB_DOCS.indexOf(docName);
    }

    function getAdjacentDoc(docName, direction) {
      const index = getDocIndex(docName);
      if (index === -1) {
        return LAB_DOCS[0];
      }

      const nextIndex = (index + direction + LAB_DOCS.length) % LAB_DOCS.length;
      return LAB_DOCS[nextIndex];
    }

    function navigateToDoc(docName) {
      const params = new URLSearchParams(window.location.search);
      params.set("doc", docName);
      window.location.search = params.toString();
    }

    function syncDocEdgeNav(selectedDoc) {
      const prevBtn = document.getElementById("doc-prev-btn");
      const nextBtn = document.getElementById("doc-next-btn");

      if (!prevBtn || !nextBtn) {
        return;
      }

      const prevDoc = getAdjacentDoc(selectedDoc, -1);
      const nextDoc = getAdjacentDoc(selectedDoc, 1);

      prevBtn.disabled = false;
      nextBtn.disabled = false;

      prevBtn.setAttribute("aria-label", `${formatDocLabel(prevDoc)} 문서로 이동`);
      nextBtn.setAttribute("aria-label", `${formatDocLabel(nextDoc)} 문서로 이동`);

      prevBtn.onclick = () => navigateToDoc(prevDoc);
      nextBtn.onclick = () => navigateToDoc(nextDoc);
    }

    function syncDocSelector(selectedDoc) {
      const select = document.getElementById("doc-select");
      if (!select) {
        return;
      }

      if (!select.dataset.initialized) {
        select.innerHTML = "";
        LAB_DOCS.forEach((file) => {
          const option = document.createElement("option");
          option.value = file;
          option.textContent = formatDocLabel(file);
          select.appendChild(option);
        });

        select.addEventListener("change", () => {
          navigateToDoc(select.value);
        });

        select.dataset.initialized = "true";
      }

      select.value = selectedDoc;
    }

    async function render() {
      const doc = document.getElementById("doc");

      try {
        const selectedDoc = resolveRequestedDoc();
        syncDocSelector(selectedDoc);
        syncDocEdgeNav(selectedDoc);
        const response = await fetch(selectedDoc, { cache: "no-cache" });
        if (!response.ok) {
          throw new Error(`${selectedDoc} 로드 실패: ${response.status}`);
        }

        const markdown = await response.text();
        const headings = buildToc(extractHeadings(markdown));

        doc.className = "";
        doc.innerHTML = marked.parse(markdown, {
          gfm: true,
          breaks: false
        });

        const pageTitleElement = document.getElementById("page-title");
        const firstLevelTitle = doc.querySelector("h1");
        const displayTitle = firstLevelTitle
          ? firstLevelTitle.textContent.trim()
          : formatDocLabel(selectedDoc);

        if (pageTitleElement) {
          pageTitleElement.textContent = displayTitle;
        }

        document.title = `${displayTitle} - Labs`;

        if (firstLevelTitle) {
          firstLevelTitle.remove();
        }

        const renderedHeadings = doc.querySelectorAll("h2, h3, h4");
        headings.forEach((h, index) => {
          if (renderedHeadings[index]) {
            renderedHeadings[index].id = h.id;
          }
        });

        decorateTipsSections(doc);
        enableH2Collapsible(doc);
        enableTocNavigation();
        addCopyButtons(doc);
        bindImageLightbox(doc);
      } catch (error) {
        doc.className = "error";
        doc.textContent = `문서를 렌더링하지 못했습니다: ${error.message}`;
      }
    }

    const imageLightbox = document.getElementById("image-lightbox");
    if (imageLightbox) {
      imageLightbox.addEventListener("click", (event) => {
        if (
          event.target.closest("[data-lightbox-close]") ||
          event.target === document.getElementById("lightbox-image")
        ) {
          closeImageLightbox();
        }
      });
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeImageLightbox();
      }
    });

    render();
    setupTocToggle();
    setupTocResizer();
    setupTocTitleJump();
  </script>
</body>
</html>
