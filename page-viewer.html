<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>20260626_SFire - Page Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0b1220;
      --surface: rgba(19, 28, 48, 0.58);
      --surface-soft: rgba(255, 255, 255, 0.08);
      --text: #e5eefb;
      --muted: rgba(229, 238, 251, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.16), transparent 24%),
        linear-gradient(180deg, #0b1220, #0f172a 40%, #111827 100%);
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: stretch;
      background: rgba(2, 6, 23, 0.18);
    }

    .page-image {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: rgba(255, 255, 255, 0.02);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.992);
    }

    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 22%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav-hit.prev {
      left: 0;
    }

    .nav-hit.next {
      right: 0;
    }

    .nav-hit.prev:hover {
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.18), transparent);
    }

    .nav-hit.next:hover {
      background: linear-gradient(270deg, rgba(15, 23, 42, 0.18), transparent);
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      z-index: 3;
      max-width: calc(100vw - 24px);
      overflow: hidden;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.24);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .indicator {
      min-width: 56px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
      padding: 0 2px;
    }

    .toc {
      position: fixed;
      right: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 2px 8px;
      max-width: min(48vw, 520px);
      padding: 2px 4px;
      font-size: 0.56rem;
      line-height: 1.15;
      color: rgba(229, 238, 251, 0.78);
      opacity: 0.95;
      z-index: 2;
      pointer-events: auto;
    }

    .toc a {
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .toc a:hover {
      color: rgba(255, 255, 255, 0.98);
    }

    @media (max-width: 720px) {
      .nav-hit {
        width: 28%;
      }

      .controls {
        bottom: 8px;
        padding: 4px 6px;
        gap: 3px;
      }

      button {
        padding: 4px 7px;
        font-size: 0.72rem;
      }

      .indicator {
        min-width: 48px;
        font-size: 0.73rem;
      }

      .toc {
        right: 6px;
        bottom: 6px;
        max-width: 58vw;
        font-size: 0.52rem;
        color: rgba(229, 238, 251, 0.82);
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img id="pageImage" class="page-image" alt="Page 1" src="Media/page-001.png" />
    <button class="nav-hit prev" id="stagePrev" type="button" aria-label="이전 페이지"></button>
    <button class="nav-hit next" id="stageNext" type="button" aria-label="다음 페이지"></button>
  </div>

  <div class="controls">
    <button id="prevBtn" type="button" aria-label="이전 페이지">이전</button>
    <div id="pageIndicator" class="indicator">1 / 45</div>
    <button id="nextBtn" type="button" aria-label="다음 페이지">다음</button>
  </div>

  <div id="toc" class="toc" aria-label="목차"></div>

  <script>
    const totalPages = 45;
    const state = { page: 1 };

    const pageImage = document.getElementById("pageImage");
    const pageIndicator = document.getElementById("pageIndicator");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const stagePrev = document.getElementById("stagePrev");
    const stageNext = document.getElementById("stageNext");
    const stage = document.getElementById("stage");
    const toc = document.getElementById("toc");

    const pad = (value) => String(value).padStart(3, "0");
    const label = (value) => String(value).padStart(2, "0");

    const tocItems = [
      { page: 1, label: "Cover" },
      { page: 11, label: "Copilot Chat" },
      { page: 17, label: "Hands-on Chat" },
      { page: 23, label: "Hands-on Word" },
      { page: 26, label: "Hands-on Excel" },
      { page: 29, label: "Hands-on PowerPoint" },
    ];

    tocItems.forEach((item, index) => {
      const link = document.createElement("a");
      link.href = `#page-${pad(item.page)}`;
      link.textContent = item.label;
      link.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage(item.page);
      });
      toc.appendChild(link);

      if (index < tocItems.length - 1) {
        const separator = document.createElement("span");
        separator.textContent = "·";
        toc.appendChild(separator);
      }
    });

    function renderPage(page) {
      state.page = page;
      const fileName = `Media/page-${pad(page)}.png`;

      pageImage.classList.add("fade-out");
      window.setTimeout(() => {
        pageImage.src = fileName;
        pageImage.alt = `Page ${page}`;
        pageIndicator.textContent = `${page} / ${totalPages}`;
        prevBtn.disabled = page === 1;
        stagePrev.disabled = page === 1;
        nextBtn.disabled = page === totalPages;
        stageNext.disabled = page === totalPages;
        pageImage.classList.remove("fade-out");
        location.hash = `page-${pad(page)}`;
      }, 120);
    }

    function goPrev() {
      if (state.page > 1) {
        renderPage(state.page - 1);
      }
    }

    function goNext() {
      if (state.page < totalPages) {
        renderPage(state.page + 1);
      }
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);
    stagePrev.addEventListener("click", goPrev);
    stageNext.addEventListener("click", goNext);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        goPrev();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        goNext();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    stage.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < 40 || Math.abs(deltaX) < Math.abs(deltaY)) {
        return;
      }

      if (deltaX < 0) {
        goNext();
      } else {
        goPrev();
      }
    }, { passive: true });

    const initialPage = (() => {
      const hash = location.hash.match(/page-(\d{3})/);
      if (!hash) return 1;
      const parsed = Number(hash[1]);
      return Number.isFinite(parsed) && parsed >= 1 && parsed <= totalPages ? parsed : 1;
    })();

    renderPage(initialPage);
  </script>
</body>
</html>
