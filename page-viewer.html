<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>20260626_SFire - Page Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --bg-soft: #111827;
      --surface: rgba(255, 255, 255, 0.08);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --text: #e5eefb;
      --muted: rgba(229, 238, 251, 0.72);
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 28%),
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.16), transparent 24%),
        linear-gradient(180deg, var(--bg), var(--bg-soft));
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 20px;
    }

    header,
    footer {
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    header {
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.2vw, 1.9rem);
      letter-spacing: -0.03em;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.65);
      background: rgba(56, 189, 248, 0.18);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .page-indicator {
      min-width: 70px;
      text-align: center;
      font-weight: 700;
      color: #ffffff;
      font-size: 0.82rem;
    }

    main {
      display: grid;
      place-items: center;
    }

    .viewer {
      width: min(100%, 1100px);
      display: grid;
      gap: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .toc {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px 10px;
      padding: 0 2px 2px;
      font-size: 0.6rem;
      line-height: 1.25;
      color: rgba(229, 238, 251, 0.42);
      opacity: 0.7;
    }

    .toc a {
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .toc a:hover {
      color: rgba(229, 238, 251, 0.7);
    }

    .stage {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.42);
      box-shadow: var(--shadow);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 22%, rgba(0, 0, 0, 0.14));
      z-index: 1;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc((100vh - 240px) * 2);
      object-fit: contain;
      background: #fff;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.992);
    }

    .stage-nav {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .nav-hit {
      width: 22%;
      height: 100%;
      pointer-events: auto;
      border: 0;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.24), transparent);
      border-radius: 0;
      color: transparent;
    }

    .nav-hit.next {
      background: linear-gradient(270deg, rgba(15, 23, 42, 0.24), transparent);
    }

    .nav-hit:hover {
      background-color: rgba(56, 189, 248, 0.12);
    }

    @media (max-width: 720px) {
      .shell {
        padding: 12px;
        gap: 12px;
      }

      header {
        padding: 14px;
        border-radius: 18px;
      }

      .toolbar {
        width: 100%;
        justify-content: space-between;
      }

      .page-indicator {
        min-width: 92px;
      }

      img {
        max-height: calc((100vh - 240px) * 2);
      }

      .nav-hit {
        width: 28%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <div class="viewer">
        <div class="stage" id="stage">
          <img id="pageImage" alt="Page 1" src="Media/page-001.png" />
          <div class="stage-nav" aria-hidden="true">
            <button class="nav-hit prev" id="stagePrev" type="button" aria-label="이전 페이지"></button>
            <button class="nav-hit next" id="stageNext" type="button" aria-label="다음 페이지"></button>
          </div>
        </div>

        <div class="controls">
          <button id="prevBtn" type="button" aria-label="이전 페이지">이전</button>
          <div id="pageIndicator" class="page-indicator">1 / 45</div>
          <button id="nextBtn" type="button" aria-label="다음 페이지">다음</button>
        </div>

        <div id="toc" class="toc" aria-label="목차"></div>

      </div>
    </main>
  </div>

  <script>
    const totalPages = 45;
    const state = { page: 1 };

    const pageImage = document.getElementById("pageImage");
    const pageIndicator = document.getElementById("pageIndicator");
    const toc = document.getElementById("toc");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const stagePrev = document.getElementById("stagePrev");
    const stageNext = document.getElementById("stageNext");
    const stage = document.getElementById("stage");

    const pad = (value) => String(value).padStart(3, "0");
    const label = (value) => String(value).padStart(2, "0");

    const tocItems = [
      { page: 1, label: "Cover" },
      { page: 11, label: "Copilot Chat" },
      { page: 17, label: "Hands-on Chat" },
      { page: 23, label: "Hands-on Word" },
      { page: 26, label: "Hands-on Excel" },
      { page: 29, label: "Hands-on PowerPoint" },
    ];

    tocItems.forEach((item, index) => {
      const link = document.createElement("a");
      link.href = `#page-${pad(item.page)}`;
      link.textContent = item.label;
      link.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage(item.page);
      });
      toc.appendChild(link);

      if (index < tocItems.length - 1) {
        const separator = document.createElement("span");
        separator.textContent = "·";
        toc.appendChild(separator);
      }
    });

    function renderPage(page) {
      state.page = page;
      const fileName = `Media/page-${pad(page)}.png`;

      pageImage.classList.add("fade-out");
      window.setTimeout(() => {
        pageImage.src = fileName;
        pageImage.alt = `Page ${page}`;
        pageIndicator.textContent = `${page} / ${totalPages}`;
        prevBtn.disabled = page === 1;
        stagePrev.disabled = page === 1;
        nextBtn.disabled = page === totalPages;
        stageNext.disabled = page === totalPages;
        pageImage.classList.remove("fade-out");
        location.hash = `page-${pad(page)}`;
      }, 120);
    }

    function goPrev() {
      if (state.page > 1) {
        renderPage(state.page - 1);
      }
    }

    function goNext() {
      if (state.page < totalPages) {
        renderPage(state.page + 1);
      }
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);
    stagePrev.addEventListener("click", goPrev);
    stageNext.addEventListener("click", goNext);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        goPrev();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        goNext();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    stage.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < 40 || Math.abs(deltaX) < Math.abs(deltaY)) {
        return;
      }

      if (deltaX < 0) {
        goNext();
      } else {
        goPrev();
      }
    }, { passive: true });

    const initialPage = (() => {
      const hash = location.hash.match(/page-(\d{3})/);
      if (!hash) return 1;
      const parsed = Number(hash[1]);
      return Number.isFinite(parsed) && parsed >= 1 && parsed <= totalPages ? parsed : 1;
    })();

    renderPage(initialPage);
  </script>
</body>
</html>
